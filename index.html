<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو محمود السوري - محول العملات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #f1c40f;
            --bg-gradient: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            perspective: 1000px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(5deg) rotateY(-5deg); }
            50% { transform: translateY(-20px) rotateX(-5deg) rotateY(5deg); }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            color: white;
            text-align: center;
            transform: translateZ(50px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: var(--accent-color);
        }

        p.subtitle {
            margin-bottom: 30px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        select option {
            background: #2c3e50;
            color: white;
        }

        .results {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .result-box:hover {
            transform: scale(1.05) translateZ(20px);
            background: rgba(255, 255, 255, 0.25);
        }

        .result-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* 3D Elements */
        .coin {
            position: absolute;
            width: 60px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
            z-index: -1;
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .coin-1 { top: -30px; left: -30px; animation-delay: 0s; }
        .coin-2 { bottom: -30px; right: -30px; animation-delay: -5s; }

    </style>
</head>
<body>

    <div class="container">
        <div class="coin coin-1">$</div>
        <div class="coin coin-2">₺</div>
        
        <div class="card">
            <h1>أبو محمود السوري</h1>
            <p class="subtitle">أفضل محول عملات بأسعار السوق الحقيقية</p>

            <div class="input-group">
                <label for="amount">المقدار:</label>
                <input type="number" id="amount" placeholder="أدخل المبلغ هنا..." value="1" oninput="convert()">
            </div>

            <div class="input-group">
                <label for="fromCurrency">من عملة:</label>
                <select id="fromCurrency" onchange="convert()">
                    <option value="USD">دولار أمريكي ($)</option>
                    <option value="SYP">ليرة سورية (ل.س)</option>
                    <option value="TRY">ليرة تركية (₺)</option>
                </select>
            </div>

            <div class="results">
                <div class="result-box" id="res1-box">
                    <div class="result-label" id="res1-label">ليرة سورية</div>
                    <div class="result-value" id="res1-val">0</div>
                </div>
                <div class="result-box" id="res2-box">
                    <div class="result-label" id="res2-label">ليرة تركية</div>
                    <div class="result-value" id="res2-val">0</div>
                </div>
            </div>

            <div class="footer">
                تم التحديث بناءً على أسعار السوق اليوم<br>
                &copy; 2026 أبو محمود السوري - جميع الحقوق محفوظة
            </div>
        </div>
    </div>

    <script>
        // أسعار الصرف الثابتة بناءً على البحث
        const rates = {
            USD: { SYP: 13450, TRY: 44.75 },
            SYP: { USD: 1/13450, TRY: 1/301 },
            TRY: { USD: 1/44.75, SYP: 301 }
        };

        const names = {
            USD: "دولار أمريكي",
            SYP: "ليرة سورية",
            TRY: "ليرة تركية"
        };

        const symbols = {
            USD: "$",
            SYP: "ل.س",
            TRY: "₺"
        };

        function convert() {
            const amount = document.getElementById('amount').value;
            const from = document.getElementById('fromCurrency').value;
            
            if (!amount || amount <= 0) {
                document.getElementById('res1-val').innerText = "0";
                document.getElementById('res2-val').innerText = "0";
                return;
            }

            const targets = Object.keys(rates).filter(c => c !== from);
            
            // النتيجة الأولى
            const target1 = targets[0];
            const val1 = (amount * rates[from][target1]).toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('res1-label').innerText = names[target1];
            document.getElementById('res1-val').innerText = val1 + " " + symbols[target1];

            // النتيجة الثانية
            const target2 = targets[1];
            const val2 = (amount * rates[from][target2]).toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('res2-label').innerText = names[target2];
            document.getElementById('res2-val').innerText = val2 + " " + symbols[target2];
        }

        // تشغيل التحويل عند التحميل
        window.onload = convert;
    </script>
</body>
</html>
